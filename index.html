<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/styles/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <title>Todo app</title>
  </head>
  <body>
    <div class="light-background"></div>

    <div class="todo-list">
      <div class="title">TODO</div>
      <div class="search-bar"></div>

      <div class="list-item">
        <ul>
          <li>
            <input type="checkbox" />
            <span>Complete online JavaScript course</span>
          </li>
          <li>
            <input type="checkbox" />
            <span>Jog around the park 3x</span>
          </li>
          <li>
            <input type="checkbox" />
            <span>10 minutes mediation</span>
          </li>
          <li>
            <input type="checkbox" />
            <span>Read for 1 hour</span>
          </li>
          <li>
            <input type="checkbox" />
            <span>Pick up groceries</span>
          </li>
          <li>
            <input type="checkbox" />
            <span>Complete Todo App on Fronted Mentor</span>
          </li>
        </ul>

        
        <div class="bottom-filter">
          <div class="item-left">
            <!-- Add dynamic number -->
            items left
          </div>

          <div class="filter">All Active Completed</div>

          <div class="remove">Clear Completed</div>
        </div>

      </div>
      <span class="drag">Drag and drop to reorder list</span>
    </div>
  </body>
</html>
